# Caviar price index — listing configuration
#
# This is the only file you edit to add or remove a tracked listing.
# One entry per LISTING, not per brand (protocol R6).

# Identify yourself honestly. You may publish this work one day; you want the
# access logs to show a polite researcher with a contact address.
user_agent: "caviar-price-index/1.0 (research project; contact: david.szarzynski@gmail.com)"
contact_email: "david.szarzynski@gmail.com"

# Seconds between requests, plus up to 50% random jitter. Do not lower this.
# You are making a handful of requests per day; there is no reason to hurry.
delay_seconds: 20
timeout_seconds: 30

listings:
  # ---------------------------------------------------------------------
  # TEMPLATE — copy this block per listing, delete the example.
  #
  # id                : filename-safe, unique, stable forever. Snapshots are
  #                     named from it, so never rename one after first run.
  # vendor_name       : who is selling it
  # url               : the exact product page
  # brand_as_listed   : the brand as the LISTING states it (verbatim, R3)
  # species_as_listed : verbatim from the listing, not normalized
  # grade_as_listed   : verbatim ("Reserve", "Royal", "Classic", ...)
  # origin_as_listed  : verbatim country/region claim
  # net_weight_g      : grams, for price-per-gram
  # selectors         : OPTIONAL. Only needed if the site has no JSON-LD
  #                     Product markup. Try without first — most Shopify,
  #                     WooCommerce and BigCommerce stores emit it.
  # ---------------------------------------------------------------------

  # WooCommerce variable product, one listing for four weight variations.
  # No JSON-LD Product markup — selectors required (verified against archived
  # HTML 2026-08-30). The .price element shows the range "$199.99 – $629.99";
  # select_one takes the FIRST amount, i.e. the LOWEST price, which is the
  # 4oz (113g) variation — net_weight_g matches that. If the lineup changes,
  # the variations table below fires description drift; reparse snapshots.
  # Species claim "grade A kaluga caviar" appears only in meta tags and the
  # variations JSON attribute — unreachable by text selectors, but captured
  # in every daily snapshot. origin: none stated on the listing.
  - id: heycaviar-our-signature-caviar-4oz-113g
    vendor_name: "Hey Caviar"
    url: "https://heycaviar.com/product/our-signature-caviar/"
    brand_as_listed: "Hey Caviar"
    species_as_listed: "kaluga"
    grade_as_listed: "grade A"
    net_weight_g: 113
    selectors:
      name: "h1.product_title"
      sale_price: ".summary .price .woocommerce-Price-amount"
      # Variation lineup only — deliberately excludes the live review count,
      # which would otherwise fire false drift alarms.
      description: "table.variations"

