name: price-scrape

on:
  schedule:
    # 14:10 UTC daily. Deliberately not on the hour — everyone's cron is on the
    # hour, and GitHub's scheduler queues behind it. Expect drift regardless;
    # scheduled runs are best-effort, not guaranteed on time.
    - cron: "10 14 * * *"
  workflow_dispatch:

# Never let two runs append to the CSV at once.
concurrency:
  group: price-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit results
        run: |
          git config user.name  "price-scrape bot"
          git config user.email "actions@github.com"
          git add data/ snapshots/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "price observations $(date -u +%Y-%m-%d)"
            # Another run may have landed while this one was working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
